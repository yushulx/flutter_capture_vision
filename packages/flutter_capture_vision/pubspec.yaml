name: flutter_capture_vision
description: Flutter plugin for Dynamsoft Capture Vision — barcode, MRZ, and document boundary detection from image files or raw buffers on six platforms.
version: 0.1.0
resolution: workspace
homepage: https://www.dynamsoft.com/capture-vision/
repository: https://github.com/yushulx/flutter_capture_vision/tree/main/packages/flutter_capture_vision
issue_tracker: https://github.com/yushulx/flutter_capture_vision/issues
topics:
  - barcode
  - mrz
  - document-detection
  - capture-vision
  - dynamsoft

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_capture_vision_platform_interface: ^0.1.0
  flutter_capture_vision_android: ^0.1.0
  flutter_capture_vision_ios: ^0.1.0
  flutter_capture_vision_web: ^0.1.0
  flutter_capture_vision_windows: ^0.1.0
  flutter_capture_vision_macos: ^0.1.0
  flutter_capture_vision_linux: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        default_package: flutter_capture_vision_android
      ios:
        default_package: flutter_capture_vision_ios
      web:
        default_package: flutter_capture_vision_web
      windows:
        default_package: flutter_capture_vision_windows
      macos:
        default_package: flutter_capture_vision_macos
      linux:
        default_package: flutter_capture_vision_linux
