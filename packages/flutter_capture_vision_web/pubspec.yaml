name: flutter_capture_vision_web
description: Web implementation of flutter_capture_vision.
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_capture_vision_platform_interface: ^0.1.0
  flutter_web_plugins:
    sdk: flutter

flutter:
  plugin:
    implements: flutter_capture_vision
    platforms:
      web:
        pluginClass: FlutterCaptureVisionWeb
        fileName: flutter_capture_vision_web.dart
